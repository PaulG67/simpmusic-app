services:
  music-play:
    image: ghcr.io/paulg67/music-play:latest
    build: .
    container_name: music-play
    ports:
      - "5080:5080"
    volumes:
      - ./config:/config
      - ./cache:/cache
      - ./logs:/logs
      # Denselben Musik-Share wie Navidrome einhängen, sonst bleiben Downloads nur im Cache.
      - /mnt/user/music:/music
    environment:
      PORT: "5080"
      SUBSONIC_USER: musicplay
      SUBSONIC_PASSWORD: changeme
      YTM_LANGUAGE: de
      YTM_LOCATION: CH
      SERVER_URL: ""
      SPONSORBLOCK: "true"
      RETURN_YOUTUBE_DISLIKE: "true"
      TRANSLATE_PROVIDER: none
      TRANSLATE_URL: ""
      TRANSLATE_API_KEY: ""
      TRANSLATE_MODEL: gpt-4o-mini
      TRANSLATE_TARGET: ""
      NAVIDROME_URL: "http://192.168.0.188:4533"
      NAVIDROME_USER: ""
      NAVIDROME_PASSWORD: ""
      NAVIDROME_MUSIC_DIR: "/music"
      NAVIDROME_IMPORT_FOLDER: "YouTube"
      MEDIASYNC_URL: ""
      MEDIASYNC_USER: ""
      MEDIASYNC_PASSWORD: ""
    # yt-dlp spawns Deno to solve YouTube's JS challenges; it gets OOM-killed
    # below roughly 512 MB, which shows up as "Signature solving failed".
    mem_limit: 2g
    restart: unless-stopped
